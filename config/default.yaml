camera:
  type: webcam
  id: 4
  serial: null
  color_width: 1280
  color_height: 720
  fps: 30
  intrinsics_file: "config/calibration/webcam/intrinsics_test_1.npz"

calibration:
  hand_eye_file: "hand_eye.npz"
  aruco:
    marker_length_m: 0.093
    dict_id: 0
    target_marker_id: 0
  hand_eye_method: TSAI
  hand_eye_compensation_m:
    x: 0.01    #0.01
    y: 0.005
    z: 0.00
detection:
  conf_threshold: 0.50
  iou_threshold: 0.45

robot:
  repo_root: null
  gripper:
    dm:
      angle_open: 4.0
      counterclockwise: true
      tau_max: 1.5
      close_torque: 1.0
      default_force: 0.30
    rs:
      angle_open: 5.0
      counterclockwise: false
      tau_max: 1.5
      close_torque: 1.5
      default_force: 0.30
  ready_pose:
    x: 0.3
    y: 0.0
    z: 0.28
    roll: 0.0
    pitch: 0.6
    duration: 3.0

yolo:
  model_name: "yoloe-26l-seg.pt"
  device: "0" #Original cpu
  use_world: true
  custom_classes:
    - "yellow screwdriver"
    - "blue cap with transparent centrifuge tube inside a container"
  #  - "glasses"
  #  - "bottle"
    - "blue cube"
grasp_pipeline:
  infer_every_live: 1
  grasp:
    table_z_m: 0.16
    depth_quantile: 0.5
    pregrasp_offset_m: 0.150
    insertion_depth_m: 0.00
    min_base_z_m: 0.00
graspnet:
  checkpoint: "checkpoint-rs.tar"
  num_point: 20000
  collision_thresh: 0.01
  min_depth: 0.05
  max_depth: 1.0
  top_k: 50
  target_class: null
  target_margin_px: 12
  target_expand_ratio: 1.35
